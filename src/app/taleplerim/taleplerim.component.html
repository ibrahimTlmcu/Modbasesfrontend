<p-card header="Taleplerim" styleClass="mb-3">
    <p-table [value]="talepler" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
             currentPageReportTemplate="Toplam {totalRecords} talep"
             [rowsPerPageOptions]="[5,10,20]">

        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>Ad Soyad</th>
                <th>Email</th>
                <th>Konu</th>
                <th>Açıklama</th>
                <th>Durum</th>
                <th></th> <!-- Buton sütunu -->
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-talep>
            <tr>
                <td>{{ talep.id }}</td>
                <td>{{ talep.adSoyad }}</td>
                <td>{{ talep.email }}</td>
                <td>{{ talep.konu }}</td>
                <td>{{ talep.aciklama }}</td>

                <!-- Durum metni -->
                <td>
                    <span *ngIf="talep.durum === 1" class="text-green-600 font-semibold">Yanıtlandı</span>
                    <span *ngIf="talep.durum !== 1" class="text-yellow-600 font-semibold">Bekliyor</span>
                </td>

                <!-- Cevabı Gör butonu -->
                <td>
                    <p-button
                        label="Cevabı Gör"
                        (click)="git(talep.id)"
                        [disabled]="talep.durum !== 1">
                    </p-button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="7" class="text-center">Hiç talep bulunamadı.</td>
            </tr>
        </ng-template>

    </p-table>
</p-card>
