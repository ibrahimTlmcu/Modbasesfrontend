<!-- src/app/ticket-list/ticket-list.component.html -->
<h2>Açık Destek Talepleri</h2>

<ul>
    <li *ngFor="let t of tickets">
        <!-- t.subject ve t.user doğrudan service’den geliyor -->
        Konu: {{ t.subject }} — Talep Eden: {{ t.user }}
        <button (click)="join(t)">
            Katıl
        </button>
    </li>
</ul>
<br>
<button
    pButton
    type="button"
    label="Yeni Talep Aç"
    icon="pi pi-plus"
    class="p-button-rounded p-button-success"
    (click)="router.navigate(['/create-ticket'])"
></button>
