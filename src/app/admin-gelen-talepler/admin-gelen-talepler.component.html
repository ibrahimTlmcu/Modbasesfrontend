<h2 class="mb-3">Gelen Talepler</h2>

<p-table [value]="talepler" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5,10,20]" responsiveLayout="scroll" [showCurrentPageReport]="true" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [sortMode]="'multiple'" class="p-datatable-striped p-datatable-gridlines">
    <ng-template pTemplate="header">
        <tr>
            <th pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
            <th pSortableColumn="adSoyad">Ad Soyad <p-sortIcon field="adSoyad"></p-sortIcon></th>
            <th pSortableColumn="email">Email <p-sortIcon field="email"></p-sortIcon></th>
            <th pSortableColumn="konu">Konu <p-sortIcon field="konu"></p-sortIcon></th>
            <th>Mesaj</th>
            <th> </th>
            <th></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-talep>
        <tr>
            <td>{{ talep.id }}</td>
            <td>{{ talep.adSoyad }}</td>
            <td>{{ talep.email }}</td>
            <td>{{ talep.konu }}</td>
<td>{{ talep.aciklama }}</td>
            <td>
                <ng-container *ngIf="talep.durum === 0; else yanitladi">
                    <span style="color: #f59e0b; font-weight: 600;">Bekliyor</span>

                </ng-container>
                <ng-template #yanitladi>
                    <span class="text-green-600 font-semibold">Yanıtlandı</span>
                </ng-template>
            </td>



            <td>
                <button pButton type="button" label="Cevapla" (click)="cevapla(talep.id)"></button>
            </td>
        </tr>
    </ng-template>
</p-table>
