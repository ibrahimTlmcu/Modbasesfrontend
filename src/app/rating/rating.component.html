<div class="rating-overlay">
    <div class="rating-card">
        <h4>Puanlama</h4>
        <p>Bu sohbeti <strong>{{ rated }}</strong> ile nasıl değerlendirirsiniz?</p>

        <div class="stars">
            <button
                *ngFor="let n of [1,2,3,4,5]"
                (click)="setScore(n)"
                [class.filled]="n <= score">
                ★
            </button>
        </div>

        <textarea
            [(ngModel)]="comment"
            placeholder="Yorum (isteğe bağlı)"
            rows="3">
        </textarea>


        <button (click)="submit()">Gönder</button>
    </div>
</div>
