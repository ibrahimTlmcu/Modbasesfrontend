<div *ngIf="talep">
    <h2>{{ talep.konu }}</h2>
    <p><strong>Ad Soyad:</strong> {{ talep.adSoyad }}</p>
    <p><strong>Email:</strong> {{ talep.email }}</p>
    <p><strong>Açıklama:</strong> {{ talep.aciklama }}</p>
</div>

<hr />

<h3>Cevaplar</h3>
<ul>
    <li *ngFor="let c of cevaplar">
        <p><strong>{{ c.cevaplayan }}</strong> ({{ c.tarih | date:'short' }}):</p>
        <p>{{ c.cevapMetni }}</p>

        gelen cevap :
    </li>
</ul>
